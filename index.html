<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastros | Biblioteca</title>
    <script>try{document.documentElement.dataset.theme=localStorage.getItem("tema")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Lora:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <script src="dados.js" defer></script>
    <script src="interface.js" defer></script>
    <script src="alunos.js" defer></script>
    <script src="livros.js" defer></script>
    <script src="vinculos.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div class="barra">
            <p class="marca"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Biblioteca</p>
            <div class="acoes">
                <nav><a href="historico.html"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Histórico</a></nav>
                <button id="tema-toggle" class="botao-tema" type="button" aria-label="Alternar entre tema claro e escuro" title="Alternar tema"><svg class="icone sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-15.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg><svg class="icone lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
            </div>
        </div>
        <h1>Cadastros</h1>
    </header>
    <main>
        <section aria-labelledby="titulo-aluno">
            <h2 id="titulo-aluno"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Cadastrar aluno</h2>
            <form id="form-aluno">
                <label for="nome-aluno">Nome do aluno</label>
                <input id="nome-aluno" name="nome" type="text" required>
                <label for="matricula-aluno">Matrícula</label>
                <input id="matricula-aluno" name="matricula" type="text" inputmode="numeric" pattern="[0-9]*" required>
                <p class="status" id="status-aluno" role="status"></p>
                <button type="submit"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>Salvar aluno</button>
            </form>
            <ul id="lista-alunos" aria-label="Alunos cadastrados"></ul>
        </section>

        <section aria-labelledby="titulo-livro">
            <h2 id="titulo-livro"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Cadastrar livro</h2>
            <form id="form-livro">
                <label for="titulo-livro-input">Título do livro</label>
                <input id="titulo-livro-input" name="titulo" type="text" required>
                <label for="autor-livro">Autor</label>
                <input id="autor-livro" name="autor" type="text" required>
                <p class="status" id="status-livro" role="status"></p>
                <button type="submit"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>Salvar livro</button>
            </form>
            <ul id="lista-livros" aria-label="Livros cadastrados"></ul>
        </section>

        <section aria-labelledby="titulo-vinculo">
            <h2 id="titulo-vinculo"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>Vincular aluno a livro</h2>
            <form id="form-vinculo" class="form-vinculo">
                <label for="aluno-vinculo">Aluno</label>
                <label for="livro-vinculo">Livro</label>
                <select id="aluno-vinculo" name="matricula" required></select>
                <select id="livro-vinculo" name="livroId" required></select>
                <p class="status" id="status-vinculo" role="status"></p>
                <button id="salvar-vinculo" type="submit"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>Salvar vínculo</button>
            </form>
            <ul id="lista-vinculos" aria-label="Alunos vinculados a livros"></ul>
        </section>
    </main>

</body>
</html>
