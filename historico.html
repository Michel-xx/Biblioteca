<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de vínculos | Biblioteca</title>
    <script>try{document.documentElement.dataset.theme=localStorage.getItem("tema")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Lora:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <script src="dados.js" defer></script>
    <script src="interface.js" defer></script>
    <script src="alunos.js" defer></script>
    <script src="livros.js" defer></script>
    <script src="vinculos.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div class="barra">
            <p class="marca"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Biblioteca</p>
            <div class="acoes">
                <nav><a href="index.html"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7"/></svg>Voltar para cadastros</a></nav>
                <button id="tema-toggle" class="botao-tema" type="button" aria-label="Alternar entre tema claro e escuro" title="Alternar tema"><svg class="icone sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-15.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg><svg class="icone lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
            </div>
        </div>
        <h1>Histórico de vínculos excluídos</h1>
    </header>

    <main>
        <section aria-labelledby="titulo-historico">
            <h2 id="titulo-historico"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Vínculos encerrados</h2>
            <button id="limpar-historico" type="button"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg>Excluir todo o histórico</button>
            <ul id="lista-historico" aria-label="Histórico de vínculos excluídos"></ul>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const botaoLimpar = document.querySelector("#limpar-historico");
            if (botaoLimpar) {
                botaoLimpar.addEventListener("click", () => {
                    if (window.Biblioteca && typeof window.Biblioteca.limparHistorico === "function") {
                        window.Biblioteca.limparHistorico();
                    }
                });
            }
        });
    </script>
</body>
</html>
